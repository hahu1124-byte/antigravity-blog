<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="スロットの天井ハイエナ期待値を概算するツール（試作）。">
  <meta name="robots" content="noindex,nofollow">
  <title>ハイエナ期待値計算ツール（試作）</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="title">🐆 ハイエナ期待値計算ツール</h1>
      <p class="subtitle">天井狙いの期待値を概算します（試作版）</p>
    </header>

    <main class="card">
      <div class="field">
        <label class="label" for="machine">機種</label>
        <select id="machine" class="select"></select>
        <p class="machine-note" id="machineNote"></p>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="label" for="currentG">現在ゲーム数</label>
          <input id="currentG" class="input" type="number" inputmode="numeric"
                 min="0" step="1" placeholder="例: 700" value="700">
        </div>
        <div class="field">
          <label class="label" for="ceiling">天井</label>
          <div class="readonly" id="ceiling">— G</div>
        </div>
      </div>

      <div class="field">
        <label class="label" for="exchange">換金率</label>
        <select id="exchange" class="select">
          <option value="20">等価（20円／枚）</option>
          <option value="17.86" selected>5.6枚交換（約17.86円／枚）</option>
          <option value="16.95">5.9枚交換（約16.95円／枚）</option>
          <option value="16.67">6.0枚交換（約16.67円／枚）</option>
        </select>
      </div>

      <section class="result" id="result">
        <div class="result-badge" id="badge">—</div>
        <div class="result-ev" id="ev">¥0</div>
        <dl class="result-detail">
          <div class="detail-item">
            <dt>残りゲーム数</dt><dd id="remainG">— G</dd>
          </div>
          <div class="detail-item">
            <dt>投資目安</dt><dd id="invest">¥0</dd>
          </div>
          <div class="detail-item">
            <dt>天井期待出玉</dt><dd id="payout">— 枚</dd>
          </div>
          <div class="detail-item">
            <dt>消化時間目安</dt><dd id="time">— 分</dd>
          </div>
        </dl>
      </section>

      <section class="zone-section" id="zoneSection">
        <h2 class="zone-title">ゾーン期待値</h2>

        <div class="zone-row">
          <div class="zone-panel zone-panel-current">
            <div class="zone-panel-label">現在の状態</div>
            <div id="currentZoneName" class="zone-in-label">—</div>
            <div id="currentZoneNote" class="zone-panel-note">—</div>
          </div>
        </div>

        <div class="zone-row">
          <div class="zone-panel">
            <div class="zone-panel-label">次のゾーン</div>
            <div id="nextZoneName" class="zone-next-name">—</div>
            <div id="nextZoneDist" class="zone-next-dist">—</div>
          </div>
          <div class="zone-panel">
            <div class="zone-panel-label">ゾーン狙いEV</div>
            <div id="nextZoneEv" class="zone-ev-val">—</div>
          </div>
        </div>
        <div id="nextZoneNote" class="zone-footnote">—</div>
      </section>

      <p class="disclaimer">
        ※ 概算ツールです。道中当選・出玉の振れ・やめ時の取りこぼしは未考慮のため、
        実際よりやや高めの目安になります。ゾーンEVはゾーン到達時の期待値のみを考慮した簡易計算です。投資は自己責任で。
      </p>
    </main>
  </div>

  <script src="./specs.js"></script>
  <script src="./script.js"></script>
</body>
</html>
