<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME | Gravity Portal</title>
    <meta
      name="description"
      content="パチンコ放置ゲーム・クイズなど、Gravity Portalで遊べるゲーム一覧。"
    />
    <meta property="og:title" content="🎮 GAME | Gravity Portal" />
    <meta
      property="og:description"
      content="パチンコ放置ゲーム・クイズなど、Gravity Portalで遊べるゲーム一覧。"
    />
    <meta property="og:url" content="https://antigravity-portal.com/game" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="🎮 GAME | Gravity Portal" />
    <meta
      name="twitter:description"
      content="パチンコ放置ゲーム・クイズなど、Gravity Portalで遊べるゲーム一覧。"
    />
    <link
      rel="stylesheet"
      href="https://hahu1124-byte.github.io/antigravity-blog/game/styles.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gp-theme");
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Gravity Portal GAME",
        "description": "パチンコ放置ゲーム・クイズなど、Gravity Portalで遊べるゲーム一覧。",
        "url": "https://antigravity-portal.com/game"
      }
    </script>
  </head>
  <body>
    <header class="gp-blog-header">
      <div class="gp-bh-inner">
        <a href="https://antigravity-portal.com/" class="gp-bh-logo"
          >Gravity Portal</a
        >
        <nav class="gp-bh-nav">
          <a
            href="https://antigravity-portal.com/tools"
            class="gp-bh-link"
            aria-label="ツール"
          >
            <span class="gp-bh-emoji">🛠️</span
            ><span class="gp-bh-label">ツール</span>
          </a>
          <a
            href="https://antigravity-portal.com/game"
            class="gp-bh-link"
            aria-label="GAME"
          >
            <span class="gp-bh-emoji">🎮</span
            ><span class="gp-bh-label">GAME</span>
          </a>
          <a
            href="https://antigravity-portal.com/lab"
            class="gp-bh-link"
            aria-label="LAB"
          >
            <span class="gp-bh-emoji">🔬</span
            ><span class="gp-bh-label">LAB</span>
          </a>
          <a
            href="https://antigravity-portal.com/blog"
            class="gp-bh-link"
            aria-label="ブログ"
          >
            <span class="gp-bh-emoji">✏️</span
            ><span class="gp-bh-label">ブログ</span>
          </a>
          <a
            href="https://x.com/hahu1124"
            target="_blank"
            rel="noopener noreferrer"
            class="gp-bh-link gp-bh-hide-mobile"
            aria-label="X"
          >
            <span class="gp-bh-emoji">𝕏</span>
          </a>
          <a
            href="https://note.com/hahu1124"
            target="_blank"
            rel="noopener noreferrer"
            class="gp-bh-link gp-bh-hide-mobile"
            aria-label="Note"
          >
            <span class="gp-bh-emoji">📝</span>
          </a>
        </nav>
        <button
          class="gp-bh-theme"
          id="gpBhThemeToggle"
          aria-label="テーマ切替"
        >
          🌙
        </button>
      </div>
    </header>
    <style>
      .gp-blog-header {
        background: #161b22;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      [data-theme="light"] .gp-blog-header {
        background: #ffffff;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .gp-bh-inner {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 1.25rem;
        height: 52px;
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }
      .gp-bh-logo {
        font-size: 1.05rem;
        font-weight: 700;
        color: #7c7ff2;
        text-decoration: none;
        white-space: nowrap;
      }
      .gp-bh-nav {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .gp-bh-nav::-webkit-scrollbar {
        display: none;
      }
      .gp-bh-link {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        height: 32px;
        padding: 0 0.7rem;
        font-size: 0.85rem;
        color: #a0aec0;
        text-decoration: none;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        white-space: nowrap;
        transition: all 0.15s ease;
      }
      [data-theme="light"] .gp-bh-link {
        color: #4a5568;
        border-color: rgba(0, 0, 0, 0.1);
      }
      .gp-bh-link:hover {
        color: #7c7ff2;
        border-color: #7c7ff2;
      }
      .gp-bh-emoji {
        font-size: 0.95rem;
        line-height: 1;
      }
      .gp-bh-theme {
        width: 32px;
        height: 32px;
        flex: none;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }
      [data-theme="light"] .gp-bh-theme {
        border-color: rgba(0, 0, 0, 0.1);
      }
      .gp-bh-theme:hover {
        border-color: #7c7ff2;
      }
      @media (max-width: 640px) {
        .gp-bh-label {
          display: none;
        }
        .gp-bh-hide-mobile {
          display: none;
        }
        .gp-bh-link {
          padding: 0;
          width: 32px;
          justify-content: center;
        }
      }
    </style>
    <script>
      (function () {
        var btn = document.getElementById("gpBhThemeToggle");
        if (!btn) return;
        function update() {
          var t = document.documentElement.getAttribute("data-theme");
          btn.textContent = t === "light" ? "🌙" : "☀️";
        }
        update();
        btn.addEventListener("click", function () {
          var cur = document.documentElement.getAttribute("data-theme");
          var next = cur === "light" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", next);
          try {
            localStorage.setItem("gp-theme", next);
          } catch (e) {}
          update();
        });
      })();
    </script>

    <div class="hub-layout">
      <header class="game-header">
        <a href="https://antigravity-portal.com/" class="game-back"
          >← TOPに戻る</a
        >
        <h1 class="game-title">🎮 GAME</h1>
        <p class="game-desc">ゲームを選んで遊ぼう！</p>
      </header>

      <main class="hub-content">
        <div class="hub-grid">
          <!-- Pachinko Idle -->
          <a href="/game/pachinko-idle/" class="hub-card">
            <span class="hub-card-icon">🎰</span>
            <h3 class="hub-card-title">Pachinko Idle</h3>
            <p class="hub-card-desc">
              確変・ST・RUSH・遊タイム等のリアルなパチンコ要素で遊ぶ放置系ゲーム。
              プレステージ・自動化・オフライン対応。
            </p>
            <div class="hub-card-meta">
              <span class="hub-badge">🎰 5台を打ち分け</span>
              <span class="hub-badge-alpha">α TEST</span>
            </div>
          </a>

          <!-- クイズ -->
          <a href="/game/quiz/" class="hub-card">
            <span class="hub-card-icon">🧠</span>
            <h3 class="hub-card-title">クイズ</h3>
            <p class="hub-card-desc">
              パチンコクイズ・一般常識クイズなど、さまざまなジャンルのクイズに挑戦！
              ランダム出題・ランク判定付き。
            </p>
            <div class="hub-card-meta">
              <span class="hub-badge">🎯 パチンコ 106問</span>
              <span class="hub-badge">🧠 一般 400問</span>
            </div>
          </a>
        </div>
      </main>
    </div>
  </body>
</html>
