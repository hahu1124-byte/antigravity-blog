<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- 赤7（横に倒した 7。左を水色水玉の手ぬぐいで縛ってある） -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a5a"/>
      <stop offset="0.35" stop-color="#f21a10"/>
      <stop offset="1" stop-color="#a80000"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a0000"/>
      <stop offset="1" stop-color="#9a0808"/>
    </linearGradient>
    <pattern id="tdots" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff"/>
      <circle cx="2" cy="2" r="1.9" fill="#46aef0"/>
      <circle cx="6" cy="6" r="1.9" fill="#46aef0"/>
    </pattern>
    <path id="body" d="M52 38 C84 30 118 29 138 32 L150 49 C155 38 164 27 178 26 C192 27 196 44 190 58 C184 72 168 82 150 86 C124 92 80 92 52 86 C44 84 40 76 41 66 C41 54 44 44 52 38 Z"/>
    <path id="frillU" d="M50 46 C42 38 36 30 33 21 C44 21 54 30 58 40 Z"/>
    <path id="frillL" d="M46 66 C36 66 22 68 12 70 C20 78 36 81 50 78 Z"/>
  </defs>

  <g transform="translate(-2 -1) translate(100 50) scale(0.96) translate(-100 -50)">
  <!-- 黒い落ち影 -->
  <g transform="translate(3 4)" fill="#000">
    <use href="#frillU"/>
    <use href="#frillL"/>
    <use href="#body"/>
  </g>

  <!-- 縛った口の赤い布（左） -->
  <g fill="url(#red)" stroke="#000" stroke-width="4" stroke-linejoin="round">
    <use href="#frillU"/>
    <use href="#frillL"/>
  </g>

  <!-- 本体 -->
  <use href="#body" fill="url(#red)" stroke="#000" stroke-width="5" stroke-linejoin="round"/>

  <!-- 中央の溝 -->
  <path d="M86 60 C108 50 134 47 151 49 C142 63 108 68 86 60 Z" fill="url(#hole)" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M95 62.5 C114 65 134 61 146 54.5 C136 64 114 68 95 62.5 Z" fill="#ffffff"/>

  <!-- 光沢 -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M68 40 C94 34 118 33 134 37" stroke-width="3.2" opacity="0.95"/>
    <path d="M170 32 C180 30 187 37 186 47" stroke-width="2.6" opacity="0.9"/>
    <path d="M78 84 C104 88 132 86 150 80" stroke="#ff9a7a" stroke-width="2" opacity="0.8"/>
    <path d="M37 26 C42 30 47 36 50 41" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- 手ぬぐい（巻き） -->
  <path d="M45 37 C53 34 61 34 67 36 L70 88 C62 91 54 91 47 89 Z" fill="url(#tdots)" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M46 53 C55 56 62 56 68.5 53 M47 71 C56 74 63 74 69.5 71" fill="none" stroke="#000" stroke-width="1.6"/>

  <!-- 手ぬぐいの結び目と端 -->
  <path d="M32 66 C26 72 20 80 22 90 C30 88 38 82 42 76 Z" fill="url(#tdots)" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M34 62 C26 58 16 56 10 60 C14 68 26 72 38 70 Z" fill="url(#tdots)" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="41" cy="68" rx="8" ry="7" fill="url(#tdots)" stroke="#000" stroke-width="3"/>
  </g>
</svg>
