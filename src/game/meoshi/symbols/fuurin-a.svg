<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- 風鈴（黄色い丸い風鈴を斜め下から見た形・オレンジの短冊） -->
  <defs>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff59a"/>
      <stop offset="0.35" stop-color="#ffe010"/>
      <stop offset="0.8" stop-color="#ffc000"/>
      <stop offset="1" stop-color="#e89a00"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd000"/>
      <stop offset="1" stop-color="#f0a800"/>
    </linearGradient>
    <radialGradient id="inside" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb030"/>
      <stop offset="0.6" stop-color="#f57a10"/>
      <stop offset="1" stop-color="#d84a00"/>
    </radialGradient>
    <linearGradient id="tan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb040"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
  </defs>

  <!-- 外側の傘 -->
  <ellipse cx="98" cy="45" rx="76" ry="39" fill="url(#dome)" stroke="#000" stroke-width="5"/>
  <path d="M42 34 C58 16 116 10 150 22 C120 16 72 20 50 38 Z" fill="#fff" opacity="0.85"/>
  <path d="M160 30 C166 36 168 44 165 50" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- 縁（内側のふち） -->
  <ellipse cx="102" cy="60" rx="58" ry="24" fill="url(#lip)" stroke="#000" stroke-width="3"/>
  <ellipse cx="102" cy="61" rx="54.5" ry="21" fill="none" stroke="#e01818" stroke-width="1.6"/>

  <!-- 中（オレンジ） -->
  <ellipse cx="104" cy="68" rx="40" ry="14" fill="url(#inside)" stroke="#000" stroke-width="2.6"/>
  <path d="M74 66 C88 60 118 60 134 65" fill="none" stroke="#ffd070" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- 糸 -->
  <path d="M108 60 L120 73" stroke="#000" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M108 60 L120 73" stroke="#fff3c0" stroke-width="1" stroke-linecap="round"/>

  <!-- 短冊（斜めに垂れる） -->
  <g transform="rotate(18 120 73)">
    <path d="M117 69.5 L161 69.5 L156.5 75.5 L161 81.5 L117 81.5 Z" fill="url(#tan)" stroke="#000" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M125 75 C129 73 131 78 135 75 C138 73 140 78 145 76 M137 79 L143 78" fill="none" stroke="#5a2000" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
