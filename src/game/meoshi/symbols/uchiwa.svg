<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- 青い丸うちわ（柄と骨が見える）。文字は「目押」 -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cb8f8"/>
      <stop offset="1" stop-color="#1874d0"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa040"/>
      <stop offset="0.5" stop-color="#e8701a"/>
      <stop offset="1" stop-color="#b04a08"/>
    </linearGradient>
    <linearGradient id="moji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a6dcff"/>
    </linearGradient>
    <clipPath id="paperClip">
      <ellipse cx="100" cy="42" rx="60" ry="35"/>
    </clipPath>
    <clipPath id="winClip">
      <path d="M78 74.6 Q100 52 122 74.6 A60 35 0 0 1 78 74.6 Z"/>
    </clipPath>
  </defs>

  <!-- 柄 -->
  <rect x="95" y="70" width="10" height="24" rx="3" fill="url(#handle)" stroke="#000" stroke-width="3"/>
  <line x1="98" y1="78" x2="98" y2="90" stroke="#ffd0a0" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>

  <!-- 紙 -->
  <ellipse cx="100" cy="42" rx="60" ry="35" fill="url(#paper)"/>
  <g clip-path="url(#paperClip)" stroke="#8ad2ff" stroke-width="1" opacity="0.55">
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(-75 100 78)"/>
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(-60 100 78)"/>
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(-45 100 78)"/>
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(-30 100 78)"/>
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(-15 100 78)"/>
    <line x1="100" y1="78" x2="100" y2="0"/>
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(15 100 78)"/>
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(30 100 78)"/>
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(45 100 78)"/>
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(60 100 78)"/>
    <line x1="100" y1="78" x2="100" y2="0" transform="rotate(75 100 78)"/>
  </g>
  <ellipse cx="100" cy="42" rx="55.5" ry="30.5" fill="none" stroke="#0e5cb0" stroke-width="1.8"/>
  <path d="M52 30 C64 14 92 9 116 10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.75"/>

  <!-- 柄の上で骨が広がる窓 -->
  <path d="M78 74.6 Q100 52 122 74.6 A60 35 0 0 1 78 74.6 Z" fill="#fff"/>
  <g clip-path="url(#winClip)" stroke="#000" stroke-width="1.1">
    <line x1="100" y1="80" x2="100" y2="40" transform="rotate(-64 100 80)"/>
    <line x1="100" y1="80" x2="100" y2="40" transform="rotate(-48 100 80)"/>
    <line x1="100" y1="80" x2="100" y2="40" transform="rotate(-32 100 80)"/>
    <line x1="100" y1="80" x2="100" y2="40" transform="rotate(-16 100 80)"/>
    <line x1="100" y1="80" x2="100" y2="40"/>
    <line x1="100" y1="80" x2="100" y2="40" transform="rotate(16 100 80)"/>
    <line x1="100" y1="80" x2="100" y2="40" transform="rotate(32 100 80)"/>
    <line x1="100" y1="80" x2="100" y2="40" transform="rotate(48 100 80)"/>
    <line x1="100" y1="80" x2="100" y2="40" transform="rotate(64 100 80)"/>
  </g>
  <path d="M78 74.6 Q100 52 122 74.6" fill="none" stroke="#000" stroke-width="2.4"/>

  <!-- 外のフチ -->
  <ellipse cx="100" cy="42" rx="60" ry="35" fill="none" stroke="#000" stroke-width="5"/>

  <!-- 文字 -->
  <text x="100" y="53" text-anchor="middle"
        font-family="'Arial Black','Hiragino Kaku Gothic StdN','Yu Gothic','Meiryo',sans-serif" font-weight="900"
        font-size="33" fill="url(#moji)" stroke="#0a4596" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">目押</text>
</svg>
