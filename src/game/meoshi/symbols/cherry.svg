<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- チェリー（赤い実 2 つ・緑の大きな葉・茶色い枝） -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52c870"/>
      <stop offset="1" stop-color="#0f7a36"/>
    </linearGradient>
    <radialGradient id="fruit" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff7a6a"/>
      <stop offset="0.45" stop-color="#e81a1a"/>
      <stop offset="1" stop-color="#9a0000"/>
    </radialGradient>
  </defs>

  <!-- 葉 -->
  <path d="M38 44 C62 16 118 6 160 30 C130 50 78 60 38 44 Z" fill="url(#leaf)" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M46 43 C80 36 120 30 152 31" fill="none" stroke="#0a5a24" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 30 C80 20 108 16 128 18" fill="none" stroke="#b8f0c0" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>

  <!-- 枝（黒いフチ → 茶色） -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 34 C130 30 100 32 82 54" stroke="#000" stroke-width="7.5"/>
    <path d="M150 34 C136 38 126 44 122 54" stroke="#000" stroke-width="7.5"/>
    <path d="M160 34 C130 30 100 32 82 54" stroke="#8a3a1c" stroke-width="3.8"/>
    <path d="M150 34 C136 38 126 44 122 54" stroke="#8a3a1c" stroke-width="3.8"/>
    <path d="M158 32 L164 31" stroke="#000" stroke-width="7.5"/>
    <path d="M158 32 L164 31" stroke="#e08a40" stroke-width="3.8"/>
  </g>

  <!-- 実 -->
  <circle cx="80" cy="71" r="22" fill="url(#fruit)" stroke="#000" stroke-width="5"/>
  <circle cx="124" cy="71" r="22" fill="url(#fruit)" stroke="#000" stroke-width="5"/>
  <path d="M66 62 C68 56 74 53 80 53" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M110 62 C112 56 118 53 124 53" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="89" cy="82" rx="5" ry="2.2" fill="#ff9a8a" opacity="0.6" transform="rotate(-30 89 82)"/>
  <ellipse cx="133" cy="82" rx="5" ry="2.2" fill="#ff9a8a" opacity="0.6" transform="rotate(-30 133 82)"/>
</svg>
