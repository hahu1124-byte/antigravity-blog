<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- 氷（かき氷ののぼりの意匠。白地に赤い「氷」、下に緑の波） -->
  <defs>
    <linearGradient id="kred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a5a"/>
      <stop offset="0.45" stop-color="#ee1414"/>
      <stop offset="1" stop-color="#b00000"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe0a0"/>
      <stop offset="0.5" stop-color="#2eaa58"/>
      <stop offset="1" stop-color="#0e7a3a"/>
    </linearGradient>
    <clipPath id="mound">
      <path d="M44 94 C42 78 42 62 50 50 C56 42 66 42 70 48 L130 48 C136 40 152 40 156 52 C160 64 158 80 160 94 Z"/>
    </clipPath>
  </defs>

  <!-- 波の山（白地） -->
  <path d="M44 94 C42 78 42 62 50 50 C56 42 66 42 70 48 L130 48 C136 40 152 40 156 52 C160 64 158 80 160 94 Z" fill="#fff"/>
  <g clip-path="url(#mound)">
    <path d="M30 100 L30 70 C46 62 58 80 78 70 C98 60 118 80 138 68 C150 62 160 66 172 70 L172 100 Z" fill="url(#sea)"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
      <path d="M48 96 C50 84 58 76 70 74"/>
      <path d="M60 96 C62 86 70 80 82 78"/>
      <path d="M136 96 C138 86 144 78 154 74"/>
      <path d="M122 96 C124 86 132 80 142 78"/>
    </g>
    <g fill="none" stroke="#2eaa58" stroke-width="2" stroke-linecap="round">
      <path d="M48 62 C52 56 60 54 66 56"/>
      <path d="M150 62 C152 58 154 56 156 58"/>
    </g>
  </g>
  <path d="M44 94 C42 78 42 62 50 50 C56 42 66 42 70 48 L130 48 C136 40 152 40 156 52 C160 64 158 80 160 94 Z"
        fill="none" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- 波頭の渦 -->
  <g fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round">
    <path d="M53 52 A6.5 6.5 0 1 1 60 58.5 A3.6 3.6 0 1 1 57.5 52.5"/>
    <path d="M151 53 A6.5 6.5 0 1 0 144 59.5 A3.6 3.6 0 1 0 146.5 53.5"/>
  </g>
  <line x1="44" y1="94" x2="160" y2="94" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 氷 -->
  <text x="101" y="83" text-anchor="middle"
        font-family="'Hiragino Kaku Gothic StdN','Yu Gothic','Meiryo',sans-serif" font-weight="900"
        font-size="74" fill="url(#kred)" stroke="#000" stroke-width="6" stroke-linejoin="round" paint-order="stroke">氷</text>
  <text x="101" y="83" text-anchor="middle"
        font-family="'Hiragino Kaku Gothic StdN','Yu Gothic','Meiryo',sans-serif" font-weight="900"
        font-size="74" fill="none" stroke="#ffb0a0" stroke-width="1" opacity="0.7">氷</text>
</svg>
