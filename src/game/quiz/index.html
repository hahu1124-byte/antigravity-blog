    <meta

    <meta name="twitter:card" content="summary" />

      content="パチンコクイズ・一般常識クイズなど、さまざまなジャンルのクイズに挑戦！"
    />
    <link
      rel="stylesheet"
      href="https://hahu1124-byte.github.io/antigravity-blog/game/styles.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gp-theme");
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "クイズ",
        "description": "パチンコクイズ・一般常識クイズなど、さまざまなジャンルのクイズに挑戦！ランダム出題・ランク判定付き。",
        "url": "https://antigravity-portal.com/game/quiz"
      }
    </script>
  </head>
  <body>
    <header class="gp-blog-header">
      <div class="gp-bh-inner">
        <a href="https://antigravity-portal.com/" class="gp-bh-logo"
          >Gravity Portal</a
        >
        <nav class="gp-bh-nav">
          <a
            href="https://antigravity-portal.com/tools"
            class="gp-bh-link"
            aria-label="ツール"
          >
            <span class="gp-bh-emoji">🛠️</span
            ><span class="gp-bh-label">ツール</span>
          </a>
          <a
            href="https://antigravity-portal.com/game"
            class="gp-bh-link"
            aria-label="GAME"
          >
            <span class="gp-bh-emoji">🎮</span
            ><span class="gp-bh-label">GAME</span>
          </a>
          <a
            href="https://antigravity-portal.com/lab"
            class="gp-bh-link"
            aria-label="LAB"
          >
            <span class="gp-bh-emoji">🔬</span
            ><span class="gp-bh-label">LAB</span>
          </a>
          <a
            href="https://antigravity-portal.com/blog"
            class="gp-bh-link"
            aria-label="ブログ"
          >
            <span class="gp-bh-emoji">✏️</span
            ><span class="gp-bh-label">ブログ</span>
          </a>
          <a
            href="https://x.com/hahu1124"
            target="_blank"
            rel="noopener noreferrer"
            class="gp-bh-link gp-bh-hide-mobile"
            aria-label="X"
          >
            <span class="gp-bh-emoji">𝕏</span>
          </a>
          <a
            href="https://note.com/hahu1124"
            target="_blank"
            rel="noopener noreferrer"
            class="gp-bh-link gp-bh-hide-mobile"
            aria-label="Note"
          >
            <span class="gp-bh-emoji">📝</span>
          </a>
        </nav>
        <button
          class="gp-bh-theme"
          id="gpBhThemeToggle"
          aria-label="テーマ切替"
        >
          🌙
        </button>
      </div>
    </header>
    <style>
      .gp-blog-header {
        background: #161b22;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      [data-theme="light"] .gp-blog-header {
        background: #ffffff;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .gp-bh-inner {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 1.25rem;
        height: 52px;
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }
      .gp-bh-logo {
        font-size: 1.05rem;
        font-weight: 700;
        color: #7c7ff2;
        text-decoration: none;
        white-space: nowrap;
      }
      .gp-bh-nav {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .gp-bh-nav::-webkit-scrollbar {
        display: none;
      }
      .gp-bh-link {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        height: 32px;
        padding: 0 0.7rem;
        font-size: 0.85rem;
        color: #a0aec0;
        text-decoration: none;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        white-space: nowrap;
        transition: all 0.15s ease;
      }
      [data-theme="light"] .gp-bh-link {
        color: #4a5568;
        border-color: rgba(0, 0, 0, 0.1);
      }
      .gp-bh-link:hover {
        color: #7c7ff2;
        border-color: #7c7ff2;
      }
      .gp-bh-emoji {
        font-size: 0.95rem;
        line-height: 1;
      }
      .gp-bh-theme {
        width: 32px;
        height: 32px;
        flex: none;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }
      [data-theme="light"] .gp-bh-theme {
        border-color: rgba(0, 0, 0, 0.1);
      }
      .gp-bh-theme:hover {
        border-color: #7c7ff2;
      }
      @media (max-width: 640px) {
        .gp-bh-label {
          display: none;
        }
        .gp-bh-hide-mobile {
          display: none;
        }
        .gp-bh-link {
          padding: 0;
          width: 32px;
          justify-content: center;
        }
      }
    </style>
    <script>
      (function () {
        var btn = document.getElementById("gpBhThemeToggle");
        if (!btn) return;
        function update() {
          var t = document.documentElement.getAttribute("data-theme");
          btn.textContent = t === "light" ? "🌙" : "☀️";
        }
        update();
        btn.addEventListener("click", function () {
          var cur = document.documentElement.getAttribute("data-theme");
          var next = cur === "light" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", next);
          try {
            localStorage.setItem("gp-theme", next);
          } catch (e) {}
          update();
        });
      })();
    </script>

    <div class="hub-layout">
      <header class="game-header">
        <a href="/game/" class="game-back">← GAMEに戻る</a>
        <h1 class="game-title-sm">🎮 クイズ</h1>
      </header>

      <main class="hub-content">
        <h2 class="hub-heading">クイズを選んで挑戦しよう！</h2>

        <div class="hub-grid">
          <!-- パチンコクイズ -->
          <a href="/game/quiz/pachinko/" class="hub-card">
            <span class="hub-card-icon">🎯</span>
            <h3 class="hub-card-title">パチンコクイズ</h3>
            <p class="hub-card-desc">
              確率・ボーダー・期待値・風営法・有名演者にまつわるクイズ。
            </p>
            <div class="hub-card-meta">
              <span class="hub-badge">📚 106問</span>
              <span class="hub-badge">⏱️ 約3分</span>
            </div>
          </a>

          <!-- 一般常識クイズ -->
          <a href="/game/quiz/general/" class="hub-card">
            <span class="hub-card-icon">🧠</span>
            <h3 class="hub-card-title">一般常識クイズ</h3>
            <p class="hub-card-desc">
              時事・教養・娯楽・IT・総合の5ジャンルから出題。
            </p>
            <div class="hub-card-meta">
              <span class="hub-badge">📰📖🎬💻🌐</span>
              <span class="hub-badge">⏱️ 約3分</span>
            </div>
          </a>
        </div>
      </main>
    </div>
  </body>
</html>
