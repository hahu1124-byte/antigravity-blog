name: Generate Uber Daily Report

on:
  schedule:
    # JST 6:00 = UTC 21:00 (前日)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 日本語フォント導入（OGP画像の豆腐化対策）
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-ipafont-gothic
          fc-cache -f -v
          fc-list :lang=ja | head -n 5

      - name: Generate daily report
        run: node scripts/generate-uber-daily.mjs

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          CHANGES=$(git diff --cached --name-only)
          if [ -n "$CHANGES" ]; then
            git commit -m "🚴 Uber daily: $(TZ=Asia/Tokyo date +%Y%m%d)"
            # 生成中に手元から push が入ると fetch first で落ちるので、取り込んでから push（最大3回）
            PUSHED=false
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then PUSHED=true; break; fi
              sleep 5
            done
            [ "$PUSHED" = "true" ] || exit 1
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
