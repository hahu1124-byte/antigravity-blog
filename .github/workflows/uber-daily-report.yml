name: Generate Uber Daily Report

on:
  schedule:
    # JST 6:00 = UTC 21:00 (前日)。実際は数時間遅れるので保険（ふだんは手元のタスクが 6:00 に起動する）
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 毎朝 6:00 は手元のタスクスケジューラ（AntigravityBlog_UberDailyDispatch → workflow_dispatch）が起動する。
  # schedule は数時間遅れるので PC が止まっていた朝の保険。その日の記事がもうあれば作り直さない
  # （手で起動した workflow_dispatch はいつでも作り直す）
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - name: その日の記事がもうあるか
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          D=$(TZ=Asia/Tokyo date +%Y%m%d)
          if gh api "repos/${{ github.repository }}/contents/src/articles/${D:0:6}/${D}_uber_daily.html" --silent; then
            echo "${D} の記事はもうある（手元から起動済み）ので作らない"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  generate:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 日本語フォント（OGP画像の豆腐化対策）は Actions のキャッシュから戻す。
      # 毎回 apt で 61MB を落とすと Azure のミラーが遅い日に 5 分を超えて落ちていた（2026-10-26・11-07）
      - name: 日本語フォントをキャッシュから戻す
        id: fontcache
        uses: actions/cache/restore@v4
        with:
          path: ~/cjk-fonts
          key: fonts-noto-cjk-sans-ipag-v1

      - name: 日本語フォント導入（キャッシュが無いときだけ）
        if: steps.fontcache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 fonts-noto-cjk fonts-ipafont-gothic

      # アイキャッチの見出しの極太（Black 900）・Medium。fonts-noto-cjk は Regular/Bold だけ。
      # 入らなくても 700 で描けるので、別の手順にして失敗しても止めない
      - name: 日本語フォントの太さを追加（キャッシュが無いときだけ）
        id: fontextra
        if: steps.fontcache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 fonts-noto-cjk-extra

      # 太さまで全部そろった日だけ保存する（欠けたまま保存すると以後ずっと 700 になるため）
      - name: 入れたフォントをキャッシュ用に写す
        if: steps.fontcache.outputs.cache-hit != 'true' && steps.fontextra.outcome == 'success'
        run: |
          mkdir -p ~/cjk-fonts
          dpkg -L fonts-noto-cjk fonts-noto-cjk-extra fonts-ipafont-gothic \
            | grep -E '/NotoSansCJK-[^/]*\.ttc$|/ipag[^/]*\.ttf$' \
            | xargs -r cp -L -t ~/cjk-fonts/
          ls -la ~/cjk-fonts

      - name: フォントをキャッシュに保存
        if: steps.fontcache.outputs.cache-hit != 'true' && steps.fontextra.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/cjk-fonts
          key: fonts-noto-cjk-sans-ipag-v1

      - name: フォントを登録
        run: |
          if [ "${{ steps.fontcache.outputs.cache-hit }}" = "true" ]; then
            mkdir -p ~/.local/share/fonts
            cp -r ~/cjk-fonts ~/.local/share/fonts/
          fi
          fc-cache -f
          [ -n "$(fc-list :lang=ja)" ] || { echo "::error::日本語フォントが見つかりません"; exit 1; }
          fc-list :lang=ja | head -n 5
          fc-list :lang=ja style | grep -i "Noto Sans CJK JP" | grep -iE "black|medium" | head -n 3 || true

      - name: Generate daily report
        run: node scripts/generate-uber-daily.mjs

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          CHANGES=$(git diff --cached --name-only)
          if [ -n "$CHANGES" ]; then
            git commit -m "🚴 Uber daily: $(TZ=Asia/Tokyo date +%Y%m%d)"
            # 生成中に手元から push が入ると fetch first で落ちるので、取り込んでから push（最大3回）
            PUSHED=false
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then PUSHED=true; break; fi
              sleep 5
            done
            [ "$PUSHED" = "true" ] || exit 1
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
